<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="./dist.css" rel="stylesheet">

  <title>Reversal Studios - Reverse Your Expectations</title>
  <meta name="description"
        content="Reversal Studios is an independent game development studio creating original indie games.">

  <link rel="icon" href="./public/logo.png" sizes="any">
  <link rel="apple-touch-icon" href="./public/logo.png">

  <link rel="stylesheet" type="text/css"
        href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css" />
  <link rel="stylesheet" type="text/css"
        href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/bold/style.css" />
  <link rel="stylesheet" type="text/css"
        href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/fill/style.css" />

  <script src="./app.js"></script>

  <!-- for SEO purposes -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Reversal Studios",
      "url": "https://www.reversalstudios.com",
      "logo": "https://www.reversalstudios.com/img/logo.png",
      "description": "Reversal Studios is an independent game development studio creating original indie games.",
      "foundingDate": "2026",
      "industry": "Video Game Development",
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "customer support",
        "email": "info@reversalstudios.com"
      },
      "knowsAbout": [
        "Indie Games",
        "Game Development",
        "Video Games",
        "Game Design"
      ]
    }
  </script>

  <meta property="og:title" content="Reversal Studios - Reverse Your Expectations" />
  <meta property="og:description"
        content="Reversal Studios is an independent game development studio creating original indie games.">
  <meta property="og:image" content="https://www.reversalstudios.com/public/logo.png">
  <meta property="og:url" content="https://www.reversalstudios.com">
  <meta name="twitter:card" content="summary_large_image">
</head>

<body>
<header><!-- populated via js --></header>
<div class="min-h-screen bg-neutral-950 text-neutral-100">

  <!-- hero section -->
  <div class="font-mono tracking-widest uppercase text-center space-y-6 py-24 px-8 relative overflow-hidden">
    <div class="absolute inset-0 -translate-y-1/4 scale-110 hover:scale-125 transition-transform duration-700 bg-radial from-red-950/80 to-black w-full aspect-square"></div>

    <h1 class="relative text-5xl font-bold flex flex-col items-center gap-2">
      <span class="text-red-500">Reversal</span>
      <span>Studios</span>
    </h1>
    <p class="relative text-neutral-400">Reverse your expectations.</p>
  </div>

  <!-- our games -->
  <div class="mx-auto container p-5 md:p-12 space-y-8">
    <div class="space-y-3">
      <p class="font-mono uppercase text-red-600">// OUR_GAMES</p>
      <h2 class="font-mono text-neutral-200 font-bold text-2xl">What we're building</h2>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
      <!-- game -->
      <div class="group hover:border-red-800 transition-colors duration-300 ease-in-out border border-neutral-700">
        <img src="./public/typeofwar_demo.png" alt="Game cover" class="object-cover w-full aspect-video">

        <div class="space-y-2 p-4">
          <h3 class="uppercase font-mono text-xl font-bold transition-colors duration-300 group-hover:text-red-300">Type of War</h3>
          <p class="text-neutral-400 mb-4">Type faster. Think quicker. A real-time typing strategy game where every
            keystroke counts.</p>

          <a href="#" class="font-mono text-neutral-500 transition-colors duration-300 group-hover:text-red-700 text-sm">LEARN MORE <i class="ph ph-arrow-square-out"></i></a>
        </div>
      </div>

      <!-- game -->
      <div class="group hover:border-red-800 transition-colors duration-300 ease-in-out border border-neutral-700">
        <div class="w-full aspect-video flex items-center justify-center text-9xl bg-linear-30 from-red-950 to-neutral-950">
          <span class="opacity-45">?</span>
        </div>

        <div class="space-y-2 p-4">
          <h3 class="uppercase font-mono text-xl font-bold transition-colors duration-300 group-hover:text-red-300">COMING SOON...</h3>
          <p class="text-neutral-400 mb-4">We're making something new right now, check back later.</p>

<!--          <a href="#" class="font-mono text-neutral-500 transition-colors duration-300 group-hover:text-red-700 text-sm">LEARN MORE <i class="ph ph-arrow-square-out"></i></a>-->
        </div>
      </div>
    </div>
  </div>

</div>
<footer><!-- populated via js --></footer>
</body>

</html>
